# Sovereign Security Platform — Production Render Blueprint Specification
# Infrastructure as Code (IaC) for Render Cloud Deployment (render.yaml)
# Docs: https://render.com/docs/blueprint-spec

services:
  # Sovereign Security Web Service (SOC V2 Dashboard, REST API & Telemetry Gateway)
  - type: web
    name: sovereign-security
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter          # Starter or Standard recommended for persistent audit disk; works on free tier without disk
    region: frankfurt      # Options: frankfurt (eu-central), oregon (us-west), ohio (us-east), singapore (ap-southeast)
    branch: master
    autoDeploy: true

    # Health & Readiness Monitoring
    healthCheckPath: /health

    # Persistent Storage for Append-Only Cryptographic Audit Ledger
    # Note: Render persistent disks require Starter plan or above.
    # For Free Tier deployment, comment out the disk section below.
    disk:
      name: sovereign-audit-ledger
      mountPath: /data
      sizeGB: 1

    # Production Environment Variables
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 4000

      - key: HOST
        value: 0.0.0.0

      - key: AUDIT_STORAGE_PATH
        value: /data/audit.log

      - key: LOG_LEVEL
        value: info

      - key: RATE_LIMIT_ENABLED
        value: "true"

      - key: REPLAY_PROTECTION_ENABLED
        value: "true"

      # Zero-Trust Ingress & Dashboard Access Controls
      - key: ENFORCE_INGRESS_AUTH
        value: "true"

      - key: PROTECT_DASHBOARD
        value: "true"

      - key: DISABLE_DASHBOARD
        value: "false"

      - key: AUDIT_MAX_MEMORY_RECORDS
        value: "500"

      - key: SOC_DASHBOARD_USER
        value: "sovereign-operator"

      - key: SOC_DASHBOARD_PASSWORD
        generateValue: true

      - key: SOVEREIGN_ADMIN_API_KEY
        generateValue: true

      - key: SOVEREIGN_OPERATOR_API_KEY
        generateValue: true

      - key: SOVEREIGN_AUDIT_API_KEY
        generateValue: true

      # Ecosystem Service Authentication Keys (Set in Render Dashboard > Environment)
      # Do NOT commit actual secrets here. Place real keys in Render's Secret Manager.
      - key: SOVEREIGN_OS_SECRET_KEY
        generateValue: true

      - key: MTF_TELEMETRY_SECRET_KEY
        generateValue: true

      - key: COMPLIANCE_LABS_SECRET_KEY
        generateValue: true

      - key: AUDIOBLUE_BUILD_SECRET_KEY
        generateValue: true

      - key: GRIDD_CORP_SECRET_KEY
        generateValue: true
